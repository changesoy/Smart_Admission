<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>路网改动比对</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/reports/assets/report.css" />
  </head>
  <body>
    <header class="bar">
      <h1>路网改动比对</h1>
      <div class="meta" id="meta">加载中…</div>
      <a class="back" href="/tools/index.html">← 返回工具台</a>
    </header>
    <div class="status" id="status">正在解析当前数据版本…</div>
    <div class="layout">
      <aside class="panel">
        <div class="panel-head">
          <div class="field-row">
            <label>旧版</label>
            <input id="old-path" spellcheck="false" />
          </div>
          <div class="field-row">
            <label>新版</label>
            <input id="new-path" spellcheck="false" />
          </div>
          <div class="field-row" style="justify-content:flex-end">
            <button class="ghost" id="reload">重新加载</button>
          </div>
          <div class="tabs" id="tabs" style="margin-top:8px"></div>
        </div>
        <div class="panel-body" id="list"></div>
        <div class="detail" id="detail">
          <div class="empty">点击左侧条目查看详情</div>
        </div>
      </aside>
      <div class="map-wrap">
        <div id="map"></div>
        <div class="legend">
          <div><span class="swatch" style="background:#b9c2cc"></span>旧版</div>
          <div><span class="swatch" style="background:#11804a"></span>新增</div>
          <div><span class="swatch" style="background:#c0392b"></span>删除</div>
          <div><span class="swatch" style="background:#e8590c"></span>位移</div>
          <div><span class="swatch" style="background:#1f6feb"></span>未变化</div>
        </div>
      </div>
    </div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module">
      import {
        createMap,
        currentDataVersion,
        escapeHtml,
        formatM,
        lineLength,
        loadJson,
        param,
        renderDetail,
        showError,
      } from "/reports/assets/report-common.js";

      const map = createMap("map");
      const baseLayer = L.featureGroup().addTo(map);
      const highlight = L.featureGroup().addTo(map);

      const state = {
        category: "all",
        items: [],
        old: null,
        new: null,
      };

      const categories = [
        ["all", "全部"],
        ["added", "新增"],
        ["removed", "删除"],
        ["moved", "位移"],
        ["same", "未变化"],
      ];

      const linesOf = (feature) => {
        const geometry = feature?.geometry;
        if (!geometry) return [];
        if (geometry.type === "LineString") return [geometry.coordinates];
        if (geometry.type === "MultiLineString") return geometry.coordinates;
        return [];
      };

      const drawLine = (coords, options) =>
        L.polyline(
          coords.map(([lng, lat]) => [lat, lng]),
          options,
        );

      const featureKey = (feature) =>
        feature.properties?.roadId ??
        feature.id ??
        feature.properties?.name ??
        "";

      const signature = (coords) =>
        coords.map(([lng, lat]) => `${lng.toFixed(7)},${lat.toFixed(7)}`).join("|");

      const itemBoundsAndDraw = (oldFeature, newFeature, color) => {
        const bounds = L.latLngBounds([]);
        const draw = (feature, options) => {
          linesOf(feature).forEach((line) => {
            const layer = drawLine(line, options).addTo(highlight);
            bounds.extend(layer.getBounds());
          });
        };
        if (oldFeature) {
          draw(oldFeature, {
            color: "#9aa4b0",
            weight: 2,
            dashArray: "5 4",
          });
        }
        if (newFeature) {
          draw(newFeature, { color, weight: 4 });
        }
        return bounds;
      };

      const buildItems = (oldFc, newFc) => {
        const oldMap = new Map(
          (oldFc.features ?? []).map((feature) => [featureKey(feature), feature]),
        );
        const newMap = new Map(
          (newFc.features ?? []).map((feature) => [featureKey(feature), feature]),
        );
        const keys = [...new Set([...oldMap.keys(), ...newMap.keys()])].sort();
        const items = [];

        keys.forEach((key) => {
          const oldFeature = oldMap.get(key);
          const newFeature = newMap.get(key);
          const oldLines = oldFeature ? linesOf(oldFeature) : [];
          const newLines = newFeature ? linesOf(newFeature) : [];
          const oldLength = oldLines.reduce((sum, line) => sum + lineLength(line), 0);
          const newLength = newLines.reduce((sum, line) => sum + lineLength(line), 0);
          const oldSig = oldLines.map(signature).join("#");
          const newSig = newLines.map(signature).join("#");
          const name =
            newFeature?.properties?.name ??
            oldFeature?.properties?.name ??
            key;

          let category = "same";
          if (!oldFeature) category = "added";
          else if (!newFeature) category = "removed";
          else if (oldSig !== newSig) category = "moved";

          const rows = [
            ["roadId", key],
            ["名称", name],
            ["状态", { added: "新增", removed: "删除", moved: "位移", same: "未变化" }[category]],
            ["旧版长度", oldFeature ? formatM(oldLength) : "—"],
            ["新版长度", newFeature ? formatM(newLength) : "—"],
            [
              "长度差",
              oldFeature && newFeature
                ? formatM(newLength - oldLength)
                : "—",
            ],
            [
              "坐标点数",
              `${oldLines.reduce((sum, line) => sum + line.length, 0)} → ${newLines.reduce(
                (sum, line) => sum + line.length,
                0,
              )}`,
            ],
          ];

          items.push({
            category,
            title: `${name}`,
            sub:
              category === "same"
                ? `未变化 · ${formatM(newLength)}`
                : `${rows[2][1]} · ${formatM(oldLength)} → ${formatM(newLength)}`,
            rows,
            draw: () =>
              itemBoundsAndDraw(
                category === "added" ? null : oldFeature,
                category === "removed" ? null : newFeature,
                category === "removed"
                  ? "#c0392b"
                  : category === "moved"
                    ? "#e8590c"
                    : category === "added"
                      ? "#11804a"
                      : "#1f6feb",
              ),
          });
        });

        return items;
      };

      const counts = () => {
        const tally = { all: state.items.length };
        state.items.forEach((item) => {
          tally[item.category] = (tally[item.category] ?? 0) + 1;
        });
        return tally;
      };

      const renderTabs = () => {
        const tally = counts();
        document.getElementById("tabs").innerHTML = categories
          .map(
            ([key, label]) =>
              `<button class="tab ${state.category === key ? "active" : ""}" data-key="${key}">${label}<span class="count">${
                tally[key] ?? 0
              }</span></button>`,
          )
          .join("");
      };

      const renderList = () => {
        const list = document.getElementById("list");
        const visible =
          state.category === "all"
            ? state.items
            : state.items.filter((item) => item.category === state.category);
        if (visible.length === 0) {
          list.innerHTML = `<div class="empty" style="padding:12px;color:var(--muted)">该分类没有条目</div>`;
          return;
        }
        list.innerHTML = visible
          .map((item) => {
            const index = state.items.indexOf(item);
            const tone =
              item.category === "added"
                ? "A"
                : item.category === "removed"
                  ? "C"
                  : item.category === "moved"
                    ? "B"
                    : "E";
            const label = { all: "全部", added: "新增", removed: "删除", moved: "位移", same: "未变化" }[
              item.category
            ];
            return `<div class="item" data-index="${index}">
              <div class="title"><span class="badge ${tone}">${label}</span>${escapeHtml(item.title)}</div>
              <div class="sub">${escapeHtml(item.sub)}</div>
            </div>`;
          })
          .join("");
      };

      const select = (index) => {
        const item = state.items[index];
        if (!item) return;
        document.querySelectorAll(".item").forEach((node) => {
          node.classList.toggle("active", Number(node.dataset.index) === index);
        });
        highlight.clearLayers();
        const bounds = item.draw();
        if (bounds.isValid()) map.fitBounds(bounds.pad(0.3), { maxZoom: 18 });
        renderDetail(document.getElementById("detail"), item.rows);
      };

      const renderBase = () => {
        baseLayer.clearLayers();
        (state.old.features ?? []).forEach((feature) => {
          linesOf(feature).forEach((line) => {
            drawLine(line, {
              color: "#b9c2cc",
              weight: 1,
              opacity: 0.8,
              interactive: false,
            }).addTo(baseLayer);
          });
        });
        if (baseLayer.getBounds().isValid()) {
          map.fitBounds(baseLayer.getBounds().pad(0.02));
        }
      };

      const load = async (oldPath, newPath) => {
        const status = document.getElementById("status");
        status.classList.remove("error");
        status.textContent = `加载 ${oldPath} 与 ${newPath}…`;
        const [oldFc, newFc] = await Promise.all([
          loadJson(oldPath),
          loadJson(newPath),
        ]);
        state.old = oldFc;
        state.new = newFc;
        state.items = buildItems(oldFc, newFc);
        state.category = "all";
        renderBase();
        renderTabs();
        renderList();
        const tally = counts();
        const changed =
          (tally.added ?? 0) + (tally.removed ?? 0) + (tally.moved ?? 0);
        document.getElementById("meta").textContent =
          `旧版 ${oldFc.features?.length ?? 0} 条 · 新版 ${newFc.features?.length ?? 0} 条 · ` +
          `新增 ${tally.added ?? 0} / 删除 ${tally.removed ?? 0} / 位移 ${tally.moved ?? 0} / 未变化 ${tally.same ?? 0}`;
        status.textContent = `数据源：${oldPath} → ${newPath}${
          changed === 0 ? " · 两版完全一致" : ""
        }`;
      };

      const boot = async () => {
        try {
          const version = await currentDataVersion();
          const oldDefault = param(
            "old",
            version ? `/data/releases/${version}/roads.geojson` : "/data/roads.geojson",
          );
          const newDefault = param("new", "/data/roads.geojson");
          document.getElementById("old-path").value = oldDefault;
          document.getElementById("new-path").value = newDefault;
          await load(oldDefault, newDefault);
        } catch (error) {
          showError(`路网比对页加载失败：${error.message}`);
        }
      };

      document.getElementById("tabs").addEventListener("click", (event) => {
        const button = event.target.closest(".tab");
        if (!button) return;
        state.category = button.dataset.key;
        renderTabs();
        renderList();
      });
      document.getElementById("list").addEventListener("click", (event) => {
        const node = event.target.closest(".item");
        if (!node) return;
        select(Number(node.dataset.index));
      });
      document.getElementById("reload").addEventListener("click", async () => {
        try {
          await load(
            document.getElementById("old-path").value.trim(),
            document.getElementById("new-path").value.trim(),
          );
        } catch (error) {
          showError(`重新加载失败：${error.message}`);
        }
      });

      boot();
    </script>
  </body>
</html>
